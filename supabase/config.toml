project_id = "contratta-ai"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.seed]
enabled = false

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.contract-interview]
verify_jwt = true

[functions.document-ocr]
verify_jwt = true

[functions.generate-contract]
verify_jwt = true

[functions.generate-receipt]
verify_jwt = true

[functions.create-signature-link]
verify_jwt = true

[functions.register-acceptance]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.notification-dispatch]
verify_jwt = false

[functions.create-checkout]
verify_jwt = true

[functions.infinitepay-webhook]
verify_jwt = false
